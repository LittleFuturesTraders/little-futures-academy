function interactiveQuestion(r,j){let id=(r.session-1)*4+r.round-1,q=r.prompts[j]||'Complete activity '+(j+1),typ=questionType(q,j),value=answers[id]?.[j],opts=optionsFor(r,j),key=r.session+'-'+r.round,correct=answerKey[key]?.[j],tf=Array.isArray(correct);return `<div class="quizquestion" id="question${j}"><h3>Question ${j+1}</h3><p>${esc(q)}</p>${typ==='written'?`<textarea class="response" id="written${j}" placeholder="Write your answer or describe your drawing...">${esc(value?.text||'')}</textarea><div class="drawtools"><button type="button" class="secondary" onclick="toggleDrawing(${j})">✏️ Draw here</button><button type="button" class="pen-color" style="background:#27a34d;color:white" onclick="setPenColor('#27a34d',this)" aria-label="Green pen">Green</button><button type="button" class="pen-color" style="background:#d73343;color:white" onclick="setPenColor('#d73343',this)" aria-label="Red pen">Red</button><button type="button" class="pen-color" style="background:#562394;color:white" onclick="setPenColor('#562394',this)" aria-label="Purple pen">Purple</button><button type="button" class="secondary" onclick="clearDrawing(${j})">Clear drawing</button></div><div class="drawarea" id="drawarea${j}" style="display:none"><canvas id="draw${j}" width="700" height="300" style="width:100%;height:240px;touch-action:none;background:white;border:2px solid #d5b9ed;border-radius:12px"></canvas></div>`:tf?`<p class="muted">Read the three statements numbered 1–3 on the illustrated activity page. Choose True or False for each.</p>${correct.map((v,n)=>`<div class="tfrow"><strong>Statement ${n+1}</strong><button type="button" class="secondary ${value?.tf?.[n]===true?'selected':''}" onclick="chooseTF(${j},${n},true)">True</button><button type="button" class="secondary ${value?.tf?.[n]===false?'selected':''}" onclick="chooseTF(${j},${n},false)">False</button></div>`).join('')}`:`<p class="muted">Read the A, B and C options on the original illustrated page above.</p><div class="answerchoices">${opts.map((o,k)=>`<button type="button" class="${value?.choice===k?'selected':''}" onclick="chooseAnswer(${j},${k})">${esc(o)}</button>`).join('')}</div>`}<p class="feedback" id="feedback${j}" aria-live="polite"></p></div>`}
function chooseTF(j,n,val){let id=current,r=BOOK.rounds[id],key=r.session+'-'+r.round,correct=answerKey[key]?.[j];answers[id]??={};answers[id][j]??={};let a=answers[id][j];if(!Array.isArray(a.tf))a.tf=[null,null,null];a.tf[n]=val;saveAnswers();document.querySelectorAll('#question'+j+' .tfrow')[n].querySelectorAll('button').forEach((b,k)=>b.classList.toggle('selected',k===(val?0:1)));let fb=document.getElementById('feedback'+j),filled=a.tf.every(x=>typeof x==='boolean');fb.textContent=filled?(a.tf.every((v,k)=>v===correct[k])?'✓ Correct! All three statements match the workbook answer key.':'Some answers need another try. Re-read the three statements on the activity page.'):'✓ Saved. Answer all three statements.';fb.className='feedback '+(filled?(a.tf.every((v,k)=>v===correct[k])?'correct':'incorrect'):'neutral');updateQuizStatus()}

function toggleDrawing(j){let a=document.getElementById('drawarea'+j);a.style.display=a.style.display==='none'?'block':'none';if(a.style.display==='block'){let c=document.getElementById('draw'+j),ctx=c.getContext('2d'),img=answers[current]?.[j]?.drawing;if(img){let pic=new Image();pic.onload=()=>ctx.drawImage(pic,0,0);pic.src=img}let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let b=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height)};c.onpointermove=e=>{if(!down)return;let b=c.getBoundingClientRect();ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle=window.lftPenColor||'#562394';ctx.lineTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height);ctx.stroke()};c.onpointerup=()=>{down=false;answers[current]??={};answers[current][j]??={};answers[current][j].drawing=c.toDataURL('image/png');saveAnswers();updateQuizStatus()}}}

function updateQuizStatus(){let id=current,r=BOOK.rounds[id],count=r.prompts.filter((p,j)=>{let a=answers[id]?.[j];return a&&(a.choice!==undefined||(Array.isArray(a.tf)&&a.tf.every(x=>typeof x==='boolean'))||!!a.text?.trim()||!!a.drawing)}).length;let el=document.getElementById('quizstatus');if(el)el.textContent=`${count} of ${r.prompts.length} activities answered. ${count===r.prompts.length?'Ready to complete this round.':'Finish each activity to unlock completion.'}`;let btn=document.getElementById('completeRoundBtn');if(btn)btn.disabled=count<r.prompts.length}

e answers need another try.';fb.className='feedback '+(ok?'correct':'incorrect')}if(a?.choice!==undefined){let fb=document.getElementById('feedback'+j);fb.textContent=known==null?'✓ Answer saved. Compare it with the original workbook answer key.':(known===a.choice?'✓ Correct! ':'Try again. ')+(feedbackText[r.session+'-'+r.round]?.[j]||'');fb.className='feedback '+(known==null?'neutral':known===a.choice?'correct':'incorrect')}});updateQuizStatus();window.scrollTo(0,0)};

 let cs=Array.from({length:20},(_,i)=>{let t=lab.tick-19+i,o=price(t-1),c=price(t);return {o,c,h:Math.max(o,c)+2,l:Math.min(o,c)-2}});
