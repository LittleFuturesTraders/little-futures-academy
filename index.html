nd": 4, "title": "Volume Detective", "lesson": 53, "activity": 54, "prompts": ["Clue Check Which is a volume clue?", "Find the Clue Which picture shows a BUSY market?", "Final Check Read each line. Circle one.", "Your Final Check Look at this chart. What do the trend, candles, and"]}, {"session": 7, "round": 1, "title": "What Is a Futures Contract?", "lesson": 55, "activity": 56, "prompts": ["Futures Contract A futures contract is a promise to trade ...", "True or False Read each line. Circle one.", "Today or Later? When do two people agree on the price?", "Think About It Why might someone want to agree on a price before the trade day?"]}, {"session": 7, "round": 2, "title": "Who Uses Futures?", "lesson": 57, "activity": 58, "prompts": ["Who Uses It? Who might use a futures contract to plan ahead?", "Baker Plan Why might a baker like a set price for flour?", "True or False Read each line. Circle one.", "Think About It Who else might want to know a price ahead of time?"]}, {"session": 7, "round": 3, "title": "Contract Details", "lesson": 59, "activity": 60, "prompts": ["Name, Size, Date Which one tells when a contract ends?", "Name Which part tells what is being traded?", "True or False Read each line. Circle one.", "Draw It Draw a contract card. Write a name, a size,"]}, {"session": 7, "round": 4, "title": "Ticks: Tiny Steps", "lesson": 61, "activity": 62, "prompts": ["What Is a Tick? A tick is ...", "Size Matters A bigger size means ...", "True or False Read each line. Circle one.", "Think About It Why is it smart to use a small size when learning?"]}, {"session": 8, "round": 1, "title": "Paper Trading", "lesson": 63, "activity": 64, "prompts": ["Paper Trade A paper trade is ...", "True or False Read each line. Circle one.", "Why Practice? Why do traders practice first?", "Think About It What would you like to practice first?"]}, {"session": 8, "round": 2, "title": "My Trade Plan", "lesson": 65, "activity": 66, "prompts": ["Plan Parts Which is NOT part of the plan? ''}>← Previous</button><button class="secondary" onclick="openRound(${Math.min(31,i+1)})" ${i===31?'disabled':''}>Next →</button></div></section>`;window.scrollTo(0,0)}function saveRound(){state.notes[current]=document.getElementById('response').value;let complete=document.getElementById('complete').checked;state.done=state.done.filter(x=>x!==current);if(complete)state.done.push(current);state.done.sort((a,b)=>a-b);persist();refresh();document.getElementById('toast').textContent='✓ Saved! '+(complete?'Round complete.':'You can return later.')}function resources(){let a=[['Mini Glossary',71],['Draw Your Own Charts (1)',72],['Draw Your Own Charts (2)',73],['My Trade Plan',74],['My Trading Journal',75],['My Progress Chart',76],['Certificate',77],['Grown-Up Answer Key (1)',78],['Grown-Up Answer Key (2)',79],['My Notes & Doodles',80]];document.getElementById('app').innerHTML=`<section class="panel"><h1>Original workbook extras</h1><p>These are the actual pages from your 80-page workbook, not replacements.</p><div class="resourcegrid">${a.map(([t,n])=>`<button onclick="showResource(${n})">${esc(t)}<br><small>Page ${n}</small></button>`).join('')}</div></section><section class="panel" id="resourceview"><p>Select a page to view.</p></section>`}function showResource(n){document.getElementById('resourceview').innerHTML=`<h2>Book page ${n}</h2><a href="${img(n)}" target="_blank"><img style="max-width:620px;width:100%;display:block;margin:auto;border-radius:12px" src="${img(n)}" alt="Original workbook page ${n}"></a>`;document.getElementById('resourceview').scrollIntoView({behavior:'smooth'})}function certificate(){document.getElementById('app').innerHTML=`<section class="panel"><h1>🏆 Little Futures Trader Certificate</h1><p>Complete all 32 rounds to earn the interactive certificate. The original printed certificate is on book page 77.</p><p><b>Progress:</b> ${state.done.length}/32 rounds</p><label>Trader's name <input id="tradername" style="padding:10px;border:2px solid #d5b9e const answerKey={'1-1':[2,0,1,null],'1-2':[2,0,1,null]};
const choiceText={'1-1':[['Only buy things','Only sell things','Buy and sell things'],['More buyers','More sellers','Fewer buyers'],['It often rises','It often falls','It cannot move']], '1-2':[['Chart A','Chart B','Chart C'],['Chart A','Chart B','Chart C'],['Chart A','Chart B','Chart C']]};
const feedbackText={'1-1':['Markets bring buyers and sellers together.','More buyers can push prices higher.','More selling pressure can push prices lower.'],'1-2':['An uptrend generally makes higher highs and higher lows.','A downtrend generally makes lower highs and lower lows.','A sideways range moves between similar highs and lows.']};

function questionType(prompt,j){return j===3||/draw|write|explain|think about|your turn|my promise|journal|make a plan|describe/i.test(prompt)?'written':/true or false/i.test(prompt)?'boolean':'multiple'}
function optionsFor(r,j){let key=r.session+'-'+r.round;if(choiceText[key]?.[j])return choiceText[key][j];let prompt=r.prompts[j]||'';if(/true or false/i.test(prompt))return ['True','False'];return ['A','B','C']}
function interactiveQuestion(r,j){let id=(r.session-1)*4+r.round-1, q=r.prompts[j]||'Complete activity '+(j+1),typ=questionType(q,j),value=answers[id]?.[j],opts=optionsFor(r,j);return `<div class="quizquestion" id="question${j}"><h3>Question ${j+1}</h3><p>${esc(q)}</p>${typ==='written'?`<textarea class="response" id="written${j}" placeholder="Write your answer or describe your drawing...">${esc(value?.text||'')}</textarea><div class="drawtools"><button type="button" class="secondary" onclick="toggleDrawing(${j})">✏️ Draw here</button><button type="button" class="secondary" onclick="clearDrawing(${j})">Clear drawing</button></div><div class="drawarea" id="drawarea${j}" style="display:none"><canvas id="draw${j}" width="700" height="300" style="width:100%;height:240px;touch-action:none;background:white;border:2px solid #d5b9ed;border-radius:12px"></canvas></div>`:`<div class="answerchoices">${opts.map((o,k)=>`<button type="button" class="${value?.choice===k?'selected':''}" onclick="chooseAnswer(${j},${k})">${esc(o)}</button>`).join('')}</div>`}<p class="feedback" id="feedback${j}" aria-live="polite"></p></div>`}
function chooseAnswer(j,k){let id=current,r=BOOK.rounds[id],key=r.session+'-'+r.round;answers[id]??={};answers[id][j]={choice:k};saveAnswers();document.querySelectorAll('#question'+j+' .answerchoices button').forEach((b,i)=>b.classList.toggle('selected',i===k));let known=answerKey[key]?.[j],fb=document.getElementById('feedback'+j);fb.textContent=known==null?'✓ Answer saved. Compare it with the original workbook answer key.':(known===k?'✓ Correct! ':'Try again. ')+(feedbackText[key]?.[j]||'');fb.className='feedback '+(known==null?'neutral':known===k?'correct':'incorrect');updateQuizStatus()}
function toggleDrawing(j){let a=document.getElementById('drawarea'+j);a.style.display=a.style.display==='none'?'block':'none';if(a.style.display==='block'){let c=document.getElementById('draw'+j),ctx=c.getContext('2d'),img=answers[current]?.[j]?.drawing;if(img){let pic=new Image();pic.onload=()=>ctx.drawImage(pic,0,0);pic.src=img}let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let b=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height)};c.onpointermove=e=>{if(!down)return;let b=c.getBoundingClientRect();ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#562394';ctx.lineTo((e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height);ctx.stroke()};c.onpointerup=()=>{down=false;answers[current]??={};answers[current][j]??={};answers[current][j].drawing=c.toDataURL('image/png');saveAnswers();updateQuizStatus()}}}
function clearDrawing(j){let c=document.getElementById('draw'+j);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);if(answers[current]?.[j])delete answers[current][j].drawing;saveAnswers();updateQuizStatus()}
function updateQuizStatus(){let id=current,r=BOOK.rounds[id],count=r.prompts.filter((p,j)=>{let a=answers[id]?.[j];return a&&(a.choice!==undefined||!!a.text?.trim()||!!a.drawing)}).length;let el=document.getElementById('quizstatus');if(el)el.textContent=`${count} of ${r.prompts.length} activities answered. ${count===r.prompts.length?'Ready to complete this round.':'Finish each activity to unlock completion.'}`;let btn=document.getElementById('completeRoundBtn');if(btn)btn.disabled=count<r.prompts.length}
function saveInteractiveRound(){let id=current,r=BOOK.rounds[id];r.prompts.forEach((p,j)=>{let el=document.getElementById('written'+j);if(el){answers[id]??={};answers[id][j]??={};answers[id][j].text=el.value}});saveAnswers();let count=r.prompts.filter((p,j)=>{let a=answers[id]?.[j];return a&&(a.choice!==undefined||!!a.text?.trim()||!!a.drawing)}).length;if(count<r.prompts.length){document.getElementById('quizstatus').textContent='Please answer every activity before completing the round.';return}state.done=state.done.filter(x=>x!==id);state.done.push(id);state.done.sort((a,b)=>a-b);persist();refresh();if(id<31)openRound(id+1);else certificate()}
function saveWritten(j){answers[current]??={};answers[current][j]??={};answers[current][j].text=document.getElementById('written'+j).value;saveAnswers();updateQuizStatus()}
openRound=function(i){current=i;let r=BOOK.rounds[i];document.getElementById('app').innerHTML=`<section class="panel"><button class="secondary" onclick="session(${r.session-1})">← Session ${r.session}</button><h1>Session ${r.session} · Round ${r.round}: ${stages[r.round-1]}</h1><h2>${esc(r.title)}</h2><p class="notice">Read your original illustrated lesson and activity pages. Answer the interactive questions underneath. Click the images only to enlarge them.</p><div class="pagegrid"><figure><a href="${img(r.lesson)}" target="_blank"><img src="${img(r.lesson)}" alt="Original book lesson page ${r.lesson}"></a><figcaption>📖 Lesson · page ${r.lesson}</figcaption></figure><figure><a href="${img(r.activity)}" target="_blank"><img src="${img(r.activity)}" alt="Original book activity page ${r.activity}"></a><figcaption>✏️ Activities · page ${r.activity}</figcaption></figure></div></section><section class="panel"><h2>Answer the activities</h2><p>Choose your answers here rather than clicking on the image. Your responses are saved on this device. For activities without a verified answer key, check the workbook answer key with a grown-up.</p>${r.prompts.map((p,j)=>interactiveQuestion(r,j)).join('')}<p id="quizstatus" class="notice"></p><div class="actions"><button id="completeRoundBtn" onclick="saveInteractiveRound()">Finish round & continue →</button><button class="secondary" onclick="openRound(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← Previous</button><button class="secondary" onclick="openRound(${Math.min(31,i+1)})" ${i===31?'disabled':''}>Next round →</button></div></section>`;r.prompts.forEach((p,j)=>{let el=document.getElementById('written'+j);if(el)el.addEventListener('input',()=>saveWritten(j));let a=answers[i]?.[j],known=answerKey[r.session+'-'+r.round]?.[j];if(a?.choice!==undefined){let fb=document.getElementById('feedback'+j);fb.textContent=known==null?'✓ Answer saved. Compare it with the original workbook answer key.':(known===a.choice?'✓ Correct! ':'Try again. ')+(feedbackText[r.session+'-'+r.round]?.[j]||'');fb.className='feedback '+(known==null?'neutral':known===a.choice?'correct':'incorrect')}});updateQuizStatus();window.scrollTo(0,0)};

home();
</script></body></html>
